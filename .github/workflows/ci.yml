# Vérification automatique à chaque envoi de code : typage, tests
# (unitaires + intégration sur une vraie base PostgreSQL) et build.
name: CI

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel_ci
          POSTGRES_DB: hotel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hotel -d hotel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://hotel:hotel_ci@localhost:5432/hotel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build (sans accès à la base, comme l'image Docker)
        run: npm run build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
          APP_SECRET: build-time-placeholder-not-used-at-runtime-000000
